<!DOCTYPE html>
<html lang="en">
  <head>
    <title></title>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1, width=device-width"></meta>
    <meta name="mobile-web-app-capable" content="yes"></meta>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"></meta>
    <link rel="apple-touch-icon" href="/icons/ios/1024.png" />
    <script src="https://cdn.jsdelivr.net/npm/ios-pwa-splash@1.0.0/cdn.min.js"></script>
    <script>iosPWASplash('/icons/ios/1024.png', '#000000');</script>
    <link rel="manifest" href="manifest.json" />

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/icons/ios/32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/icons/ios/192.png" type="image/png" sizes="192x192">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.fluid.classless.min.css">
    <link rel="stylesheet" href="css/main.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <main data-controller='progress'>
      <header>
        <nav>
          <ul><li><a href="/categories.html">« Categories</a></li></ul>
          <ul><li class="title"><strong>Progress</strong></li></ul>
          <ul></ul>
        </nav>
      </header>
      <section role="content" class="plain">
        <div class="progress-list" data-progress-target="list"></div>
      </section>
    </main>

    <!-- The whole row toggles, not just its heading: the chart is the biggest
         thing on the row, and a chart that ignores a tap reads as broken. The
         range and metric buttons stop the click before it gets here. -->
    <div id="progress-item" class="progress-item" style="display: none;"
         data-action="click->progress#toggle">
      <div class="progress-head">
        <button type="button" class="progress-toggle">
          <span class="progress-labels">
            <span data-role="name">{Category}</span>
            <span data-role="summary" class="progress-summary">{totals}</span>
          </span>
          <span data-role="percent" class="progress-percent">{0 %}</span>
        </button>
        <button type="button" class="progress-export" aria-label="Save image"
                data-action="click->progress#exportImage">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 3v11M8 11l4 4 4-4M4 19h16"></path>
          </svg>
        </button>
        <!-- Outside the button so the export can sit beside the percentage and
             the disclosure still ends the row. -->
        <svg class="progress-caret" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"
             fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M8 5l7 7-7 7"></path>
        </svg>
      </div>
      <!-- Zooming widens the canvas inside this scroller rather than moving a
           window over the data, so the chart can be panned back through the
           history instead of only ever showing the most recent stretch. -->
      <div class="progress-plot">
        <div data-role="scroll" class="progress-scroll">
          <div data-role="canvas" class="progress-canvas">
            <div data-role="chart" class="progress-chart"></div>
            <div data-role="effort" class="progress-chart"></div>
            <!-- Inside the canvas so the dates pan with the charts. -->
            <div data-role="axis" class="progress-axis"></div>
          </div>
        </div>
      </div>
      <div data-role="detail" class="progress-detail" style="display: none;">
        <div class="progress-footer">
          <span data-role="total" class="progress-total"></span>
          <div data-role="metrics" class="progress-ranges"></div>
        </div>
        <div data-role="ranges" class="progress-ranges"></div>
      </div>
    </div>
  </body>
</html>
