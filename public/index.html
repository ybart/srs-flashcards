<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="initial-scale=1, width=device-width"></meta>
    <meta name="mobile-web-app-capable" content="yes"></meta>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"></meta>
    <link rel="apple-touch-icon" href="/icons/ios/1024.png" />
    <script src="https://cdn.jsdelivr.net/npm/ios-pwa-splash@1.0.0/cdn.min.js"></script>
    <script>iosPWASplash('/icons/ios/1024.png', '#000000');</script>
    <link rel="manifest" href="manifest.json" />

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/icons/ios/32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/icons/ios/192.png" type="image/png" sizes="192x192">

    <link rel="apple-touch-icon" href="/icons/ios/180.png" sizes="180x180">
    
  <title>SRS Flashcards</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .hidden {
      display: none;
    }
    #loader { width: min(80vw, 320px); text-align: center; }
    #loader-icon { width: 96px; height: 96px; margin-bottom: 20px; border-radius: 22%; }
    #loader progress { width: 100%; }
    #cache-status { margin-top: 12px; color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div id="loader" class="hidden">
    <img id="loader-icon" src="/icons/ios/192.png" alt="" width="96" height="96">
    <progress id="cache-progress" max="100"></progress>
    <p id="cache-status">Preparing…</p>
  </div>

  <script>
    const loader = document.getElementById('loader');
    const progressBar = document.getElementById('cache-progress');
    const statusEl = document.getElementById('cache-status');

    function updateProgress(current, total) {
      if (!total) return;
      statusEl.textContent = 'Installing…'; // real progress -> determinate
      progressBar.value = Math.round((current / total) * 100);
    }

    // Attach the SW message listener immediately (before register) so we don't
    // miss CACHE_PROGRESS messages sent during install — that timing gap is why
    // the bar previously stayed indeterminate.
    let resolveCacheComplete;
    const cacheComplete = new Promise(resolve => { resolveCacheComplete = resolve; });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', (event) => {
        const data = event.data || {};
        if (data.type === 'CACHE_PROGRESS') {
          updateProgress(data.args[0], data.args[1]);
        } else if (data.type === 'CACHE_COMPLETE') {
          progressBar.value = 100;
          resolveCacheComplete();
        }
      });
    }

    async function registerServiceWorker() {
      if (!isPWA()) {
        redirectBasedOnPWAStatus();
        return;
      }

      if (!('serviceWorker' in navigator)) {
        console.log('Service worker not supported');
        redirectBasedOnPWAStatus();
        return;
      }

      const swReadyTimeout = setTimeout(() => {
        logToServiceWorker('Service worker ready timeout - proceeding anyway');
        redirectBasedOnPWAStatus();
      }, 30000);

      try {
        const reg = await navigator.serviceWorker.register('/sw.js');
        console.log('[UI] Registration succeeded');

        // First install: show the loader and wait for the precache to finish.
        if (!navigator.serviceWorker.controller) {
          loader.classList.remove('hidden');
          await cacheComplete;
          clearTimeout(swReadyTimeout);
          logToServiceWorker('Service worker and cache ready');
          redirectBasedOnPWAStatus();
          return;
        }

        // Returning launch: check for an update and apply it automatically.
        clearTimeout(swReadyTimeout);
        await maybeUpdateThenRedirect(reg);
      } catch (error) {
        clearTimeout(swReadyTimeout);
        logToServiceWorker('Service worker failed:', error);
        redirectBasedOnPWAStatus();
      }
    }

    // At launch, check for a new version and apply it automatically ("Updating…").
    // If offline the check just fails and we proceed. (Safari may show its own
    // "no internet" dialog on that failed check — a known PWA limitation we
    // accept; the app itself works fully offline.)
    async function maybeUpdateThenRedirect(reg) {
      try {
        await reg.update();
        const installing = reg.installing;
        if (installing) {
          await new Promise((resolve) => {
            installing.addEventListener('statechange', () => {
              if (installing.state === 'installed' || installing.state === 'redundant') resolve();
            });
            setTimeout(resolve, 8000);
          });
        }
      } catch (e) { /* offline / failed — proceed */ }

      if (!reg.waiting) { redirectBasedOnPWAStatus(); return; }

      loader.classList.remove('hidden');
      statusEl.textContent = 'Updating…';

      let done = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (done) return;
        done = true;
        window.location.reload();
      });
      reg.waiting.postMessage({ type: 'SKIP_WAITING' });

      setTimeout(() => { if (!done) redirectBasedOnPWAStatus(); }, 15000);
    }

    function isPWA() {
      return window.matchMedia('(display-mode: standalone)').matches || 
                 (window.navigator.standalone) ||
                 document.referrer.includes('android-app://');
    }

    function redirectBasedOnPWAStatus() {
      logToServiceWorker('Redirecting to:', isPWA() ? 'categories.html' : 'install.html');
      window.location.href = isPWA() ? 'categories.html' : 'install.html';
    }

    function logToServiceWorker(message, ...args) {
      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({
          type: 'UI_LOG',
          message,
          args
        });
      } else {
        console.log(message, ...args);
      }
    }

    // Start the registration
    registerServiceWorker();
  </script>
</body>
</html>
