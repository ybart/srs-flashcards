    <script>
      /* TEMP diagnostic (offline-dialog hunt) — remove once identified.
         Logs persist to localStorage['diagLog'] so they can be read AFTER
         attaching a console. Retrieve:  copy(localStorage.getItem('diagLog'))
         or:  JSON.parse(localStorage.getItem('diagLog')).join('\n')
         Clear:  localStorage.removeItem('diagLog') */
      function diagLog() {
        var args = Array.prototype.slice.call(arguments);
        try { console.warn.apply(console, ['[diag]'].concat(args)); } catch (e) {}
        try {
          var log = JSON.parse(localStorage.getItem('diagLog') || '[]');
          log.push(new Date().toISOString() + ' [' + location.pathname + '] ' + args.join(' '));
          if (log.length > 300) log = log.slice(-300);
          localStorage.setItem('diagLog', JSON.stringify(log));
        } catch (e) {}
      }
      window.addEventListener('error', function (e) {
        var t = e && e.target;
        if (t && t !== window && (t.src || t.href)) {
          diagLog('resource FAILED:', t.tagName, t.src || t.href);
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        diagLog('unhandledrejection:', (e.reason && (e.reason.message || e.reason)) || 'unknown');
      });
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('message', function (e) {
          if (e.data && e.data.type === 'FETCH_FAILED') {
            diagLog('SW network FAILED:', e.data.args[0], '(mode:', e.data.args[1] + ')');
          }
        });
      }
      diagLog('page load, onLine =', navigator.onLine);
    </script>
