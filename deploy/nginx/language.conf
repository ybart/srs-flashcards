# Serves install.fr.html to a browser that asks for French first, and
# install.html to everyone else, from the same URL. Both pages exist as files, so
# either can also be fetched directly — which is what makes this testable.
#
# Goes in /etc/nginx/conf.d/<domain>.d/ on the YunoHost host; see
# docs/DEPLOYMENT.md section 4c.

location = /install.html {
    root /var/www/my_webapp/www;

    # `map` is the usual way to read Accept-Language, and it cannot be used here:
    # YunoHost includes this file *inside* the server block, and `map` is only
    # valid at http level. `set` and `if` are both allowed in a location, and this
    # stays inside the rewrite-module directives, which is the part of `if` that
    # behaves predictably.
    #
    # Only the first tag is honoured. Parsing q-values is not something nginx does
    # without contortions, and matching ",fr" anywhere would hand French to a
    # browser asking for "en-GB,fr;q=0.8" — which prefers English.
    set $install_page /install.html;
    if ($http_accept_language ~* "^\s*fr") {
        set $install_page /install.fr.html;
    }
    try_files $install_page /install.html;

    # Without this, any cache in front of nginx — including the browser's —
    # serves whichever language it saw first to everybody.
    add_header Vary "Accept-Language" always;

    # Re-declared: a location with its own add_header stops inheriting the
    # server-level ones, and the app needs cross-origin isolation for OPFS.
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
}
