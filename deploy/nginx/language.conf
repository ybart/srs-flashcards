# Serves install.fr.html to a browser that asks for French first, and
# install.html to everyone else, from the same URL. Both pages exist as files, so
# either can also be fetched directly — which is what makes this testable.
#
# Goes in /etc/nginx/conf.d/<domain>.d/ on the YunoHost host; see
# docs/DEPLOYMENT.md section 4c.

location = /install.html {
    root /var/www/my_webapp/www;

    # `map` is the usual way to read Accept-Language and cannot be used here:
    # YunoHost includes this file *inside* the server block, and `map` is only
    # valid at http level.
    #
    # It is `rewrite ... break` rather than `set` plus `try_files`, because
    # try_files is silently ignored once a request has passed through a matched
    # `if` — the `if` creates an implicit nested location that does not inherit
    # it, so the original URI is served and the switch appears to do nothing.
    # `break` keeps the rewritten URI in this location, so the headers below still
    # apply; `last` would re-enter location matching and lose them.
    #
    # Only the first tag is honoured. nginx cannot weigh q-values without
    # contortions, and matching "fr" anywhere in the header would hand French to a
    # browser asking for "en-GB,fr;q=0.8", which prefers English.
    if ($http_accept_language ~* "^fr") {
        rewrite ^ /install.fr.html break;
    }

    # Without this, any cache in front of nginx — including the browser's —
    # serves whichever language it saw first to everybody.
    add_header Vary "Accept-Language" always;

    # Re-declared: a location with its own add_header stops inheriting the
    # server-level ones, and the app needs cross-origin isolation for OPFS.
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
}
